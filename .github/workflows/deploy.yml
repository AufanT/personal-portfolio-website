name: Deploy to Subdomain

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      # ─────────────────────────────────────────────
      # STAGE 1: Deploy Node.js runtime ke nodejs/aufan/
      # ─────────────────────────────────────────────
      - name: 📁 Prepare nodejs deploy folder
        run: |
          mkdir -p /tmp/nodejs-deploy

          # Salin file & folder runtime Node.js
          cp -r .next /tmp/nodejs-deploy/.next
          cp -r node_modules /tmp/nodejs-deploy/node_modules
          [ -d public ] && cp -r public /tmp/nodejs-deploy/public
          [ -f package.json ] && cp package.json /tmp/nodejs-deploy/package.json
          [ -f package-lock.json ] && cp package-lock.json /tmp/nodejs-deploy/package-lock.json
          [ -f server.js ] && cp server.js /tmp/nodejs-deploy/server.js

      - name: 🚀 Deploy ke nodejs/aufan/ via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: /tmp/nodejs-deploy/
          server-dir: nodejs/aufan/
          dangerous-clean-slate: false
          timeout: 900000
          exclude: |
            **/.git*
            **/.env*

      # ─────────────────────────────────────────────
      # STAGE 2: Deploy static files ke public_html/aufan/
      # ─────────────────────────────────────────────
      - name: 📁 Prepare public_html deploy folder
        run: |
          mkdir -p /tmp/pubhtml-deploy

          # Salin folder .builds jika ada
          [ -d .builds ] && cp -r .builds /tmp/pubhtml-deploy/.builds

          # Salin .htaccess jika ada
          [ -f .htaccess ] && cp .htaccess /tmp/pubhtml-deploy/.htaccess

      - name: 🌐 Deploy ke public_html/aufan/ via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: /tmp/pubhtml-deploy/
          server-dir: public_html/aufan/
          dangerous-clean-slate: false
          timeout: 120000
          exclude: |
            **/.git*
            **/.env*
