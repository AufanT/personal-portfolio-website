name: Deploy to Subdomain

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Push built files to deploy branch
        shell: bash
        run: |
          set -e

          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          # Buat folder staging deploy
          mkdir -p /tmp/deploy-stage

          # Copy file-file yang dibutuhkan server
          cp -r .next /tmp/deploy-stage/.next
          rm -rf /tmp/deploy-stage/.next/cache
          if [ -d public ]; then cp -r public /tmp/deploy-stage/public; fi
          if [ -f package.json ]; then cp package.json /tmp/deploy-stage/package.json; fi
          if [ -f package-lock.json ]; then cp package-lock.json /tmp/deploy-stage/package-lock.json; fi
          if [ -f server.js ]; then cp server.js /tmp/deploy-stage/server.js; fi

          # Checkout atau buat branch deploy
          git fetch origin deploy 2>/dev/null || true
          git worktree add /tmp/deploy-worktree deploy 2>/dev/null || \
            (git branch deploy origin/deploy 2>/dev/null || git branch deploy; \
             git worktree add /tmp/deploy-worktree deploy)

          # Hapus isi lama, copy konten baru
          cd /tmp/deploy-worktree
          git rm -rf . --quiet 2>/dev/null || true
          cp -r /tmp/deploy-stage/. .

          # Commit dan push
          git add -A
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan, skip push"
          else
            git commit -m "deploy: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push origin deploy
            echo "Deploy branch updated!"
          fi
