name: Deploy to Subdomain

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      # ─────────────────────────────────────────────
      # STAGE 1: Deploy Node.js runtime ke nodejs/aufan/
      # node_modules TIDAK diupload — di-install via SSH
      # ─────────────────────────────────────────────
      - name: 📁 Prepare nodejs deploy folder
        shell: bash
        run: |
          set -e
          mkdir -p _deploy/nodejs

          cp -r .next _deploy/nodejs/.next
          if [ -d public ]; then cp -r public _deploy/nodejs/public; fi
          if [ -f package.json ]; then cp package.json _deploy/nodejs/package.json; fi
          if [ -f package-lock.json ]; then cp package-lock.json _deploy/nodejs/package-lock.json; fi
          if [ -f server.js ]; then cp server.js _deploy/nodejs/server.js; fi

          echo "✅ nodejs deploy folder ready:"
          ls -la _deploy/nodejs/

      - name: 🚀 Deploy ke nodejs/aufan/ via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./_deploy/nodejs/
          server-dir: nodejs/aufan/
          dangerous-clean-slate: false
          timeout: 300000
          exclude: |
            **/.git*
            **/.env*
            **/node_modules/**

      # ─────────────────────────────────────────────
      # STAGE 2: Deploy static files ke public_html/aufan/
      # ─────────────────────────────────────────────
      - name: 📁 Prepare public_html deploy folder
        shell: bash
        run: |
          set -e
          mkdir -p _deploy/pubhtml

          if [ -d .builds ]; then cp -r .builds _deploy/pubhtml/.builds; fi
          if [ -f .htaccess ]; then cp .htaccess _deploy/pubhtml/.htaccess; fi

          echo "✅ public_html deploy folder ready:"
          ls -la _deploy/pubhtml/

      - name: 🌐 Deploy ke public_html/aufan/ via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./_deploy/pubhtml/
          server-dir: public_html/aufan/
          dangerous-clean-slate: false
          timeout: 120000
          exclude: |
            **/.git*
            **/.env*

      # ─────────────────────────────────────────────
      # STAGE 3: SSH ke server — npm install & restart app
      # ─────────────────────────────────────────────
      - name: 🔑 SSH — npm install & restart Node.js app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ~/nodejs/aufan
            npm install --production --prefer-offline
            # Restart app (sesuaikan dengan cara hosting kamu menjalankan Node.js)
            # Jika pakai passenger/phusion (cPanel style):
            touch tmp/restart.txt
            echo "✅ Deploy selesai!"

