<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit/Tambah Blog - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .step-item {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .img-preview {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
            margin-top: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            display: none;
        }
        .step-img-preview {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 6px;
            border: 1px solid rgba(255,255,255,0.1);
            display: none;
        }
        .btn-upload {
            background: rgba(17, 207, 61, 0.1);
            border: 1px solid var(--color-accent);
            color: var(--color-accent);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .btn-upload:hover {
            background: rgba(17, 207, 61, 0.25);
        }
        .uploading-spinner {
            display: none;
            color: var(--color-accent);
            font-size: 0.8rem;
        }
    </style>
</head>
<body class="bg-dark text-white">
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><a href="dashboard.html" class="text-white text-decoration-none"><i class="bi bi-arrow-left me-2"></i></a> Form Blog</h2>
            <button type="submit" form="blogForm" class="btn btn-primary px-5 rounded-pill fw-bold">Simpan Blog</button>
        </div>

        <form id="blogForm">
            <div class="row g-4">
                <!-- Kolom Kiri: Informasi Utama + Langkah -->
                <div class="col-md-8">
                    <div class="card bg-dark border-secondary p-4 mb-4">
                        <h5 class="mb-3">Informasi Utama</h5>
                        <div class="mb-3">
                            <label class="form-label small text-secondary">Judul Artikel</label>
                            <input type="text" id="title" class="form-control custom-input" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-secondary">Deskripsi Singkat</label>
                            <textarea id="description" class="form-control custom-input" rows="2"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label small text-secondary">Subjek / Matkul</label>
                                <input type="text" id="subject" class="form-control custom-input" value="Praktikum">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label small text-secondary">Link GitHub</label>
                                <input type="url" id="github_url" class="form-control custom-input">
                            </div>
                        </div>
                    </div>

                    <div class="card bg-dark border-secondary p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="mb-0">Langkah-langkah Praktikum</h5>
                            <button type="button" id="addStep" class="btn btn-sm btn-outline-success">
                                <i class="bi bi-plus-circle me-1"></i> Tambah Langkah
                            </button>
                        </div>
                        <div id="steps-container">
                            <!-- Dynamic steps will go here -->
                        </div>
                    </div>
                </div>

                <!-- Kolom Kanan: Media & Status -->
                <div class="col-md-4">
                    <div class="card bg-dark border-secondary p-4 mb-4">
                        <h5 class="mb-3">Media & Status</h5>

                        <!-- Cover Image Upload -->
                        <div class="mb-3">
                            <label class="form-label small text-secondary">Cover Image</label>
                            <div class="d-flex gap-2 align-items-center">
                                <input type="text" id="cover_url" class="form-control custom-input"
                                    placeholder="URL akan muncul setelah upload..." readonly>
                                <button type="button" id="uploadCoverBtn" class="btn-upload">
                                    <i class="bi bi-cloud-upload me-1"></i> Upload
                                </button>
                            </div>
                            <span class="uploading-spinner" id="coverSpinner">
                                <i class="bi bi-arrow-repeat spin me-1"></i> Mengupload...
                            </span>
                            <img id="cover-preview" class="img-preview" alt="Cover Preview">
                        </div>

                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="is_published">
                            <label class="form-check-label" for="is_published">Publikasikan artikel</label>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <!-- Cloudinary Upload Widget -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <script src="../js/supabase.js?v=3"></script>
    <script src="../js/supabase-config.js?v=3"></script>
    <script>
        // ===== Cloudinary Config =====
        const CLOUDINARY_CLOUD_NAME = 'djzg0k2g9';
        const CLOUDINARY_UPLOAD_PRESET = 'blog_uploads';

        // Fungsi buka Cloudinary Widget — callback(url) dipanggil setelah upload sukses
        function openCloudinaryWidget(callback, spinnerEl) {
            const widget = cloudinary.createUploadWidget({
                cloudName: CLOUDINARY_CLOUD_NAME,
                uploadPreset: CLOUDINARY_UPLOAD_PRESET,
                sources: ['local', 'url', 'camera'],
                multiple: false,
                maxFileSize: 5000000, // 5MB
                clientAllowedFormats: ['jpg', 'jpeg', 'png', 'gif', 'webp'],
                styles: {
                    palette: {
                        window: '#1a1a2e',
                        windowBorder: '#11cf3d',
                        tabIcon: '#11cf3d',
                        menuIcons: '#ccc',
                        textDark: '#ffffff',
                        textLight: '#f0f0f0',
                        link: '#11cf3d',
                        action: '#11cf3d',
                        inactiveTabIcon: '#aaa',
                        error: '#ff6b6b',
                        inProgress: '#11cf3d',
                        complete: '#11cf3d',
                        sourceBg: '#0d0d1a'
                    }
                }
            }, (error, result) => {
                if (error) {
                    console.error('Upload error:', error);
                    if (spinnerEl) spinnerEl.style.display = 'none';
                    return;
                }
                if (result.event === 'upload-added' && spinnerEl) {
                    spinnerEl.style.display = 'inline';
                }
                if (result.event === 'success') {
                    if (spinnerEl) spinnerEl.style.display = 'none';
                    callback(result.info.secure_url);
                }
            });
            widget.open();
        }

        // ===== Cover Image Upload =====
        const coverUrlInput = document.getElementById('cover_url');
        const coverPreview  = document.getElementById('cover-preview');
        const coverSpinner  = document.getElementById('coverSpinner');

        document.getElementById('uploadCoverBtn').addEventListener('click', () => {
            openCloudinaryWidget((url) => {
                coverUrlInput.value = url;
                coverPreview.src = url;
                coverPreview.style.display = 'block';
            }, coverSpinner);
        });

        // Tampilkan preview jika URL sudah ada (mode edit)
        function showCoverPreview(url) {
            if (url) {
                coverUrlInput.value = url;
                coverPreview.src = url;
                coverPreview.style.display = 'block';
            }
        }

        // ===== Steps (Langkah-langkah) =====
        const stepsContainer = document.getElementById('steps-container');
        const addStepBtn     = document.getElementById('addStep');
        const blogForm       = document.getElementById('blogForm');
        const params         = new URLSearchParams(window.location.search);
        const blogId         = params.get('id');

        function createStepHtml(title = '', text = '', imageUrl = '') {
            const div = document.createElement('div');
            div.className = 'step-item';
            div.innerHTML = `
                <div class="d-flex justify-content-between mb-2">
                    <label class="small fw-bold">Detail Langkah</label>
                    <button type="button" class="btn-close btn-close-white remove-step"></button>
                </div>
                <input type="text"
                    class="form-control custom-input mb-2 step-title"
                    placeholder="Judul Langkah" value="${title}" required>
                <textarea
                    class="form-control custom-input mb-2 step-text"
                    placeholder="Deskripsi/Konten langkah" rows="3" required>${text}</textarea>

                <div class="d-flex gap-2 align-items-center">
                    <input type="text"
                        class="form-control custom-input step-image"
                        placeholder="URL Gambar (opsional)" value="${imageUrl}" readonly>
                    <button type="button" class="btn-upload upload-step-img">
                        <i class="bi bi-cloud-upload"></i>
                    </button>
                </div>
                <span class="uploading-spinner step-spinner">
                    <i class="bi bi-arrow-repeat spin me-1"></i> Mengupload...
                </span>
                ${imageUrl ? `<img src="${imageUrl}" class="step-img-preview" style="display:block;" alt="preview">` : '<img class="step-img-preview" alt="preview">'}
            `;

            // Tombol hapus step
            div.querySelector('.remove-step').addEventListener('click', () => div.remove());

            // Tombol upload gambar step
            div.querySelector('.upload-step-img').addEventListener('click', () => {
                const imgInput   = div.querySelector('.step-image');
                const imgPreview = div.querySelector('.step-img-preview');
                const spinner    = div.querySelector('.step-spinner');

                openCloudinaryWidget((url) => {
                    imgInput.value = url;
                    imgPreview.src = url;
                    imgPreview.style.display = 'block';
                }, spinner);
            });

            stepsContainer.appendChild(div);
        }

        addStepBtn.addEventListener('click', () => createStepHtml());

        // ===== Load data existing (mode edit) =====
        async function loadExistingData() {
            if (!blogId) {
                createStepHtml();
                return;
            }

            const { data, error } = await supabaseClient
                .from('blogs').select('*').eq('id', blogId).single();
            if (error) return alert(error.message);

            document.getElementById('title').value       = data.title || '';
            document.getElementById('description').value = data.description || '';
            document.getElementById('subject').value     = data.subject || 'Praktikum';
            document.getElementById('github_url').value  = data.github_url || '';
            document.getElementById('is_published').checked = data.is_published || false;

            showCoverPreview(data.cover_url || '');

            if (data.content && Array.isArray(data.content) && data.content.length > 0) {
                data.content.forEach(step =>
                    createStepHtml(step.title || '', step.text || '', step.image_url || ''));
            } else {
                createStepHtml();
            }
        }

        // ===== Submit Form =====
        blogForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const steps = Array.from(document.querySelectorAll('.step-item')).map(item => ({
                title:     item.querySelector('.step-title').value,
                text:      item.querySelector('.step-text').value,
                image_url: item.querySelector('.step-image').value || null
            }));

            const payload = {
                title:        document.getElementById('title').value.trim(),
                description:  document.getElementById('description').value.trim() || null,
                subject:      document.getElementById('subject').value.trim() || 'Praktikum',
                github_url:   document.getElementById('github_url').value.trim() || null,
                cover_url:    coverUrlInput.value.trim() || null,
                is_published: document.getElementById('is_published').checked,
                content:      steps
            };

            let result;
            if (blogId) {
                result = await supabaseClient.from('blogs').update(payload).eq('id', blogId);
            } else {
                result = await supabaseClient.from('blogs').insert([payload]);
            }

            if (result.error) alert(result.error.message);
            else window.location.href = 'dashboard.html';
        });

        // ===== Auth Check =====
        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) window.location.href = 'index.html';
        }

        checkAuth().then(loadExistingData);
    </script>
</body>
</html>
