<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Aufan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        body { 
            background-color: var(--color-bg); 
            color: var(--color-text);
            min-height: 100vh;
        }
        
        /* Navbar Glassmorphism */
        .navbar-admin {
            background: var(--bg-glass);
            border-bottom: 1px solid rgba(17, 207, 61, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }
        
        /* Primary Neon Button */
        .btn-neon {
            background-color: var(--color-accent);
            color: #000;
            font-weight: 600;
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(17, 207, 61, 0.2);
        }
        .btn-neon:hover {
            background-color: #15e646;
            color: #000;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(17, 207, 61, 0.4);
        }

        /* Glassmorphism Card for Table */
        .glass-card {
            background: var(--bg-glass);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Custom Table Styling */
        .table {
            margin-bottom: 0;
            color: var(--color-text);
        }
        .table th {
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--color-accent);
            font-weight: 600;
            padding: 1rem;
            border-top: none;
        }
        .table td {
            background: transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 1.2rem 1rem;
            vertical-align: middle;
            transition: all 0.3s ease;
        }
        .table tbody tr {
            transition: all 0.3s ease;
        }
        .table tbody tr:hover td {
            background: rgba(17, 207, 61, 0.03);
        }
        .table tbody tr:last-child td {
            border-bottom: none;
        }

        /* Status Badges */
        .badge-published {
            background: rgba(17, 207, 61, 0.15);
            color: var(--color-accent);
            border: 1px solid rgba(17, 207, 61, 0.3);
            padding: 0.5em 0.8em;
            font-weight: 500;
        }
        .badge-draft {
            background: rgba(255, 193, 7, 0.15);
            color: #ffc107;
            border: 1px solid rgba(255, 193, 7, 0.3);
            padding: 0.5em 0.8em;
            font-weight: 500;
        }
        .badge-subject {
            background: rgba(255, 255, 255, 0.05);
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.4em 0.8em;
            font-weight: normal;
        }

        /* Action Buttons */
        .btn-action {
            width: 35px;
            height: 35px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .btn-edit {
            background: rgba(13, 202, 240, 0.1);
            color: #0dcaf0;
            border: 1px solid rgba(13, 202, 240, 0.2);
        }
        .btn-edit:hover {
            background: rgba(13, 202, 240, 0.2);
            color: #0dcaf0;
            transform: translateY(-2px);
        }
        .btn-delete {
            background: rgba(220, 53, 69, 0.1);
            color: #dc3545;
            border: 1px solid rgba(220, 53, 69, 0.2);
        }
        .btn-delete:hover {
            background: rgba(220, 53, 69, 0.2);
            color: #dc3545;
            transform: translateY(-2px);
        }

        /* Loading State */
        .auth-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            flex-direction: column;
            gap: 15px;
        }
        .spin { animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .empty-state {
            padding: 3rem 0;
            text-align: center;
        }
        .empty-state i {
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.1);
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark navbar-admin mb-5 sticky-top py-3">
        <div class="container">
            <span class="navbar-brand fw-bold" style="color: var(--color-accent); font-size: 1.2rem;">
                <i class="bi bi-shield-lock me-2"></i>Admin Panel
            </span>
            <div class="d-flex align-items-center gap-3">
                <span id="userEmail" class="text-secondary small d-none d-md-inline fw-light"></span>
                <a href="../blog.html" target="_blank" class="btn btn-outline-light btn-sm rounded-pill px-3" style="border-color: rgba(255,255,255,0.2);">
                    <i class="bi bi-box-arrow-up-right me-1 small"></i>Live Web
                </a>
                <button id="logoutBtn" class="btn btn-outline-danger btn-sm rounded-pill px-3">
                    <i class="bi bi-box-arrow-right me-1 small"></i>Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Auth Loading State -->
    <div id="authLoading" class="auth-loading">
        <i class="bi bi-arrow-repeat spin" style="color: var(--color-accent); font-size: 2.5rem;"></i>
        <p class="text-secondary small letter-spacing-1">MEMVERIFIKASI SESI...</p>
    </div>

    <!-- Main Content (hidden until auth confirmed) -->
    <div id="mainContent" class="container d-none pb-5">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <div>
                <h2 class="text-white fw-bold mb-1">Manajemen Blog</h2>
                <p class="text-secondary small mb-0">Kelola postingan praktikum dan artikelmu.</p>
            </div>
            <a href="form.html" class="btn btn-neon rounded-pill px-4 py-2">
                <i class="bi bi-plus-lg me-2"></i>Buat Artikel Baru
            </a>
        </div>

        <!-- Blog Table -->
        <div class="glass-card">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th width="35%">Judul Artikel</th>
                            <th width="20%">Kategori / Subjek</th>
                            <th width="15%">Status</th>
                            <th width="15%">Tanggal</th>
                            <th width="15%" class="text-end pe-4">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="blog-table-body">
                        <tr id="loadingRow">
                            <td colspan="5" class="text-center text-secondary py-5">
                                <i class="bi bi-arrow-repeat spin me-2"></i>Memuat data dari database...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../js/supabase.js?v=3"></script>
    <script src="../js/supabase-config.js?v=3"></script>
    <script>
        const authLoading = document.getElementById('authLoading');
        const mainContent = document.getElementById('mainContent');
        const userEmailEl = document.getElementById('userEmail');

        // ===== Init Dashboard =====
        async function initDashboard() {
            const { data: { session }, error } = await supabaseClient.auth.getSession();
            
            if (error || !session) {
                window.location.href = 'index.html';
                return;
            }

            // Auth confirmed — tampilkan konten
            authLoading.classList.add('d-none');
            mainContent.classList.remove('d-none');
            if (session.user?.email) {
                userEmailEl.textContent = session.user.email;
                userEmailEl.classList.remove('d-none');
            }

            await loadBlogs();
        }

        // ===== Auth State Listener (untuk auto-logout jika session expired) =====
        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_OUT' || !session) {
                window.location.href = 'index.html';
            }
        });

        // ===== Load Blog Table =====
        async function loadBlogs() {
            const { data, error } = await supabaseClient
                .from('blogs')
                .select('*')
                .order('created_at', { ascending: false });

            const tbody = document.getElementById('blog-table-body');

            if (error) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">Gagal memuat data: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="empty-state">
                            <i class="bi bi-journal-x d-block"></i>
                            <h5 class="text-white mt-3 mb-1">Belum ada artikel</h5>
                            <p class="text-secondary small mb-3">Mulai tulis perjalanan praktikummu sekarang.</p>
                            <a href="form.html" class="btn btn-sm btn-outline-light rounded-pill px-3">Tulis Artikel Pertama</a>
                        </td>
                    </tr>`;
                return;
            }

            tbody.innerHTML = data.map(blog => `
                <tr>
                    <td>
                        <div class="text-white fw-semibold mb-1" style="font-size: 1.05rem;">${blog.title}</div>
                        <div class="text-secondary small text-truncate" style="max-width: 300px;">
                            ${blog.description || 'Tanpa deskripsi'}
                        </div>
                    </td>
                    <td>
                        <span class="badge badge-subject rounded-pill">${blog.subject || 'Umum'}</span>
                    </td>
                    <td>
                        <span class="badge rounded-pill ${blog.is_published ? 'badge-published' : 'badge-draft'}">
                            <i class="bi ${blog.is_published ? 'bi-check-circle-fill' : 'bi-clock-fill'} me-1"></i>
                            ${blog.is_published ? 'Published' : 'Draft'}
                        </span>
                    </td>
                    <td class="text-secondary small">
                        ${new Date(blog.created_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' })}
                    </td>
                    <td class="text-end pe-4">
                        <a href="form.html?id=${blog.id}" class="btn-action btn-edit me-2" title="Edit Artikel">
                            <i class="bi bi-pencil-square"></i>
                        </a>
                        <button onclick="deleteBlog('${blog.id}')" class="btn-action btn-delete" title="Hapus Artikel">
                            <i class="bi bi-trash3"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // ===== Delete Blog =====
        async function deleteBlog(id) {
            if (!confirm('Yakin ingin menghapus artikel ini? Aksi ini tidak dapat dibatalkan.')) return;
            const { error } = await supabaseClient.from('blogs').delete().eq('id', id);
            if (error) alert('Gagal menghapus: ' + error.message);
            else loadBlogs();
        }

        // ===== Logout =====
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        });

        // Jalankan saat load
        initDashboard();
    </script>
</body>
</html>
