<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Aufan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        body { background-color: var(--color-bg); }
        .navbar-admin {
            background: rgba(1, 15, 28, 0.95);
            border-bottom: 1px solid rgba(17, 207, 61, 0.2);
            backdrop-filter: blur(10px);
        }
        .auth-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            flex-direction: column;
            gap: 12px;
        }
        .spin { animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark navbar-admin mb-5 sticky-top">
        <div class="container">
            <span class="navbar-brand fw-bold" style="color: var(--color-accent);">
                <i class="bi bi-shield-lock me-2"></i>Admin Dashboard
            </span>
            <div class="d-flex align-items-center gap-3">
                <span id="userEmail" class="text-secondary small d-none d-md-inline"></span>
                <a href="../blog.html" target="_blank" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-eye me-1"></i>Lihat Blog
                </a>
                <button id="logoutBtn" class="btn btn-outline-danger btn-sm">
                    <i class="bi bi-box-arrow-right me-1"></i>Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Auth Loading State -->
    <div id="authLoading" class="auth-loading">
        <i class="bi bi-arrow-repeat spin text-success fs-2"></i>
        <p class="text-secondary small">Memverifikasi sesi...</p>
    </div>

    <!-- Main Content (hidden until auth confirmed) -->
    <div id="mainContent" class="container d-none">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-white">Kelola Blog</h2>
            <a href="form.html" class="btn btn-primary rounded-pill px-4">
                <i class="bi bi-plus-lg me-2"></i>Tambah Blog
            </a>
        </div>

        <!-- Blog Table -->
        <div class="card bg-dark border-secondary">
            <div class="table-responsive">
                <table class="table table-dark table-hover mb-0">
                    <thead>
                        <tr>
                            <th>Judul</th>
                            <th>Subjek</th>
                            <th>Status</th>
                            <th>Tanggal</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="blog-table-body">
                        <tr id="loadingRow">
                            <td colspan="5" class="text-center text-secondary py-4">
                                <i class="bi bi-arrow-repeat spin me-2"></i>Memuat data...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../js/supabase.js?v=3"></script>
    <script src="../js/supabase-config.js?v=3"></script>
    <script>
        const authLoading = document.getElementById('authLoading');
        const mainContent = document.getElementById('mainContent');
        const userEmailEl = document.getElementById('userEmail');

        // ===== Init Dashboard =====
        async function initDashboard() {
            const { data: { session }, error } = await supabaseClient.auth.getSession();
            
            if (error || !session) {
                window.location.href = 'index.html';
                return;
            }

            // Auth confirmed — tampilkan konten
            authLoading.classList.add('d-none');
            mainContent.classList.remove('d-none');
            if (session.user?.email) {
                userEmailEl.textContent = session.user.email;
                userEmailEl.classList.remove('d-none');
            }

            await loadBlogs();
        }

        // ===== Auth State Listener (untuk auto-logout jika session expired) =====
        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_OUT' || !session) {
                window.location.href = 'index.html';
            }
        });

        // ===== Load Blog Table =====
        async function loadBlogs() {
            const { data, error } = await supabaseClient
                .from('blogs')
                .select('*')
                .order('created_at', { ascending: false });

            const tbody = document.getElementById('blog-table-body');

            if (error) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">Gagal memuat data: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-secondary py-4">Belum ada artikel. <a href="form.html" class="text-success">Buat yang pertama!</a></td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(blog => `
                <tr>
                    <td class="text-white fw-semibold">${blog.title}</td>
                    <td><span class="badge bg-secondary">${blog.subject || '-'}</span></td>
                    <td>
                        <span class="badge ${blog.is_published ? 'bg-success' : 'bg-warning text-dark'}">
                            ${blog.is_published ? '✓ Published' : '⏳ Draft'}
                        </span>
                    </td>
                    <td class="text-secondary small">${new Date(blog.created_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' })}</td>
                    <td>
                        <a href="form.html?id=${blog.id}" class="btn btn-sm btn-outline-info me-1" title="Edit">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <button onclick="deleteBlog('${blog.id}')" class="btn btn-sm btn-outline-danger" title="Hapus">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // ===== Delete Blog =====
        async function deleteBlog(id) {
            if (!confirm('Yakin ingin menghapus artikel ini? Aksi ini tidak dapat dibatalkan.')) return;
            const { error } = await supabaseClient.from('blogs').delete().eq('id', id);
            if (error) alert('Gagal menghapus: ' + error.message);
            else loadBlogs();
        }

        // ===== Logout =====
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        });

        // Jalankan saat load
        initDashboard();
    </script>
</body>
</html>
