<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Aufan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-5">
        <div class="container">
            <span class="navbar-brand fw-bold">Admin Dashboard</span>
            <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-white">Kelola Blog</h2>
            <a href="form.html" class="btn btn-primary rounded-pill"><i class="bi bi-plus-lg me-2"></i>Tambah Blog</a>
        </div>

        <div class="card bg-dark border-secondary">
            <div class="table-responsive">
                <table class="table table-dark table-hover mb-0">
                    <thead>
                        <tr>
                            <th>Judul</th>
                            <th>Subjek</th>
                            <th>Status</th>
                            <th>Tanggal</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="blog-table-body">
                        <!-- Data will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script>
        // Check Auth
        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) window.location.href = 'index.html';
            return session;
        }

        async function loadBlogs() {
            const { data, error } = await supabaseClient
                .from('blogs')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) return console.error(error);

            const tbody = document.getElementById('blog-table-body');
            tbody.innerHTML = data.map(blog => `
                <tr>
                    <td>${blog.title}</td>
                    <td><span class="badge bg-secondary">${blog.subject}</span></td>
                    <td>
                        <span class="badge ${blog.is_published ? 'bg-success' : 'bg-warning'}">
                            ${blog.is_published ? 'Published' : 'Draft'}
                        </span>
                    </td>
                    <td>${new Date(blog.created_at).toLocaleDateString()}</td>
                    <td>
                        <a href="form.html?id=${blog.id}" class="btn btn-sm btn-info me-2"><i class="bi bi-pencil"></i></a>
                        <button onclick="deleteBlog('${blog.id}')" class="btn btn-sm btn-danger"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        async function deleteBlog(id) {
            if (confirm('Yakin ingin menghapus blog ini?')) {
                const { error } = await supabaseClient.from('blogs').delete().eq('id', id);
                if (error) alert(error.message);
                else loadBlogs();
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        });

        checkAuth().then(loadBlogs);
    </script>
</body>
</html>
