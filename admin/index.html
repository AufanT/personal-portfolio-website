<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Aufan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        body { background-color: var(--color-bg); }
        .login-box {
            max-width: 400px;
            margin: 100px auto;
            background: var(--bg-glass);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-box text-center">
            <h2 class="text-white fw-bold mb-4">Admin Login</h2>
            <form id="loginForm">
                <div class="mb-3 text-start">
                    <label class="text-secondary small">Email</label>
                    <input type="email" id="email" class="form-control custom-input" required>
                </div>
                <div class="mb-4 text-start">
                    <label class="text-secondary small">Password</label>
                    <input type="password" id="password" class="form-control custom-input" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill fw-bold">Login</button>
            </form>
            <p id="errorMsg" class="text-danger mt-3 small d-none"></p>
            <a href="../index.html" class="d-block mt-4 text-secondary text-decoration-none small">Kembali ke Beranda</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                errorMsg.innerText = error.message;
                errorMsg.classList.remove('d-none');
            } else {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
