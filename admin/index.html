<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Aufan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        body { background-color: var(--color-bg-main); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-box {
            width: 100%;
            max-width: 420px;
            background: var(--bg-glass);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        .brand-icon {
            width: 56px;
            height: 56px;
            background: rgba(17, 207, 61, 0.15);
            border: 1px solid var(--color-accent);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 1.5rem;
            color: var(--color-accent);
        }
        .btn-login {
            background: var(--color-accent);
            color: #000;
            font-weight: 700;
            border: none;
            padding: 12px;
            border-radius: 12px;
            transition: 0.3s;
        }
        .btn-login:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(17, 207, 61, 0.3); }
        .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }
        .spin { animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="brand-icon"><i class="bi bi-shield-lock"></i></div>
        <h2 class="text-white fw-bold text-center mb-1">Admin Panel</h2>
        <p class="text-secondary text-center small mb-4">Masuk untuk mengelola blog</p>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label text-secondary small">Email</label>
                <input type="email" id="email" class="form-control custom-input" placeholder="admin@email.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary small">Password</label>
                <input type="password" id="password" class="form-control custom-input" placeholder="••••••••" required>
            </div>

            <div id="errorMsg" class="alert alert-danger py-2 small d-none" role="alert"></div>

            <button type="submit" id="loginBtn" class="btn btn-login w-100">
                <span id="btnText">Login</span>
                <span id="btnSpinner" class="d-none">
                    <i class="bi bi-arrow-repeat spin me-1"></i> Memproses...
                </span>
            </button>
        </form>

        <a href="../index.html" class="d-block mt-4 text-secondary text-decoration-none small text-center">
            <i class="bi bi-arrow-left me-1"></i> Kembali ke Beranda
        </a>
    </div>

    <script src="../js/supabase.js?v=2"></script>
    <script src="../js/supabase-config.js?v=2"></script>
    <script>
        // Jika sudah login, langsung redirect ke dashboard
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (session) window.location.href = 'dashboard.html';
        });

        const loginForm   = document.getElementById('loginForm');
        const loginBtn    = document.getElementById('loginBtn');
        const btnText     = document.getElementById('btnText');
        const btnSpinner  = document.getElementById('btnSpinner');
        const errorMsg    = document.getElementById('errorMsg');

        function setLoading(isLoading) {
            loginBtn.disabled = isLoading;
            btnText.classList.toggle('d-none', isLoading);
            btnSpinner.classList.toggle('d-none', !isLoading);
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.remove('d-none');
        }

        function hideError() {
            errorMsg.classList.add('d-none');
            errorMsg.textContent = '';
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            setLoading(true);

            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                // Terjemahkan pesan error Supabase ke bahasa Indonesia
                const errMap = {
                    'Invalid login credentials': 'Email atau password salah.',
                    'Email not confirmed':       'Email belum dikonfirmasi. Cek inbox kamu.',
                    'Too many requests':         'Terlalu banyak percobaan. Tunggu sebentar.',
                };
                showError(errMap[error.message] || error.message);
                setLoading(false);
            } else {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
