<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Detail - Aufan Taufiqurrahman</title>
    <link rel="shortcut icon" href="images/favicon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        .blog-header {
            background: linear-gradient(rgba(1, 15, 28, 0.9), rgba(1, 15, 28, 1));
            background-size: cover;
            background-position: center;
        }

        .content-section {
            background: var(--bg-glass);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .step-card {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .step-card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .step-img {
            max-width: 100%;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        pre {
            background: #000;
            color: var(--color-accent);
            border-radius: 8px;
            overflow-x: auto;
        }

        .h5-md {
            font-size: 1.1rem;
            font-weight: 600;
        }

        @media (max-width: 576px) {
            #blog-title {
                font-size: 2rem !important;
            }

            .blog-header {
                padding-top: 100px;
                padding-bottom: 30px;
            }

            .step-card h3 {
                font-size: 1rem !important;
            }

            .badge {
                font-size: 0.75rem !important;
            }

            .h5-md {
                font-size: 0.95rem !important;
            }
        }

        @media (min-width: 992px) {
            .h5-md {
                font-size: 1.25rem;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top pt-3 pb-3">
        <div class="container px-5">
            <a class="navbar-brand fw-bold fs-4" href="index.html" style="color: var(--color-accent);">
                <i class="bi bi-code-slash me-2"></i>Aufan
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto text-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="portofolio.html">Portofolio</a></li>
                    <li class="nav-item"><a class="nav-link active" href="blog.html">Blog</a></li>
                    <li class="nav-item"><a class="nav-link" href="kontak.html">Contact</a></li>
                </ul>
            </div>
            <div class="music-widget">
                <button id="musicBtn" class="btn-music">
                    <i class="bi bi-volume-mute-fill" id="musicIcon"></i>
                </button>
                <div class="volume-container">
                    <input type="range" id="volSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.2">
                </div>
                <audio id="bgAudio"></audio>
            </div>
        </div>
    </nav>

    <header id="blog-header" class="blog-header text-center" style="padding-top: 120px; padding-bottom: 40px;">
        <div class="container-fluid px-4 px-md-5">
            <span id="blog-badge" class="badge rounded-pill badge-neon mb-2 mb-md-3">Loading...</span>
            <h1 id="blog-title" class="display-4 fw-bold text-white mb-2 mb-md-3" style="word-wrap: break-word;">Memuat
                Judul...</h1>
            <p id="blog-date" class="text-secondary"></p>
            <div id="blog-links" class="mt-2 mt-md-3"></div>
        </div>
    </header>

    <section class="py-3 py-md-5">
        <div class="container-fluid px-3 px-sm-4 px-md-5">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-11 col-md-10 col-lg-8">
                    <div id="blog-content" class="content-section p-4 p-sm-4 p-md-5">
                        <div class="text-center py-5">
                            <div class="spinner-border text-success" role="status"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="pt-5 pb-3 text-white text-center">
        <div class="container">
            <p class="small text-secondary">&copy; 2025 <strong>Aufan</strong>. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/supabase.js?v=2"></script>
    <script src="js/supabase-config.js?v=2"></script>
    <script src="js/music.js?v=2"></script>
    <script src="js/script.js?v=2"></script>
    <script src="js/blog-detail.js?v=2"></script>
</body>

</html>
